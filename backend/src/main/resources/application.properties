# ==============================================================================
# InsecurePay Backend - Configuracion ENDURECIDA (Laboratorio 17 - Remediacion)
# ==============================================================================

server.port=8080

# Configuracion de Base de Datos H2 en Memoria
spring.datasource.url=jdbc:h2:mem:insecure_pay_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:}

# [REMEDIACION 4.2 - A05:2021] Consola H2 deshabilitada y sin acceso remoto.
# Para depuracion local: H2_CONSOLE_ENABLED=true (solo accesible desde localhost).
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Hibernate & JPA (sin volcado de SQL en consola)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# [REMEDIACION 4.2 - CWE-209] Sin fuga de trazas, mensajes internos ni errores de binding.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.whitelabel.enabled=false

# Respuestas de error en formato RFC 7807 (application/problem+json)
spring.mvc.problemdetails.enabled=true

# [REMEDIACION 4.2 - A02:2021 / CWE-798] Secreto JWT externalizado (minimo 256 bits).
# Genere uno con:  openssl rand -base64 48   y exportelo como JWT_SECRET.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# [REMEDIACION - A05:2021] Origenes CORS permitidos (lista separada por comas)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
